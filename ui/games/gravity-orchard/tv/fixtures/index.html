<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gravity Orchard · GO4 diagnostic fixture</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f2ecdc;color:#263b32;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column}#fixture-tools{height:38px;min-height:38px;display:flex;align-items:center;gap:12px;padding:4px 14px;background:#203c34;color:#fff;font-size:12px}#fixture-tools strong{letter-spacing:.06em}#fixture-tools label{display:flex;align-items:center;gap:6px}#fixture-tools button,#fixture-tools select{height:28px;font:inherit;border:1px solid #a1b8ac;border-radius:5px;background:#fbf8ef;color:#203c34}#fixture-root{flex:1;min-height:0;min-width:0;position:relative}body[data-clean="true"] #fixture-tools{display:none}#fixture-status{margin-left:auto}button:focus-visible,select:focus-visible{outline:3px solid #ffcf68;outline-offset:2px}
  </style>
</head>
<body>
  <header id="fixture-tools" aria-label="Diagnostic fixture controls">
    <strong>GO4 · PUBLIC FIXTURE</strong>
    <label>Scene <select id="fixture-scene" aria-label="Fixture scene"></select></label>
    <button id="fixture-next">Next journey frame</button>
    <button id="fixture-reset">Restart journey</button>
    <span id="fixture-status">Injected snapshots · no live room</span>
  </header>
  <main id="fixture-root" aria-label="Gravity Orchard TV fixture"></main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
