[package]
name = "sofa-arcade-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Local Tauri host for Sofa Arcade"
license = "LicenseRef-Sofa-Arcade"
publish = false

[[bin]]
name = "sofa-arcade"
path = "src/main.rs"
required-features = ["native"]

[lib]
name = "sofa_desktop"
path = "src/lib.rs"

[features]
default = ["native"]
native = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]
# Never enabled in distribution builds. This is the official embedded macOS WebDriver route.
native-e2e = ["native", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
url = "=2.5.7"
tauri = { version = "=2.12.7", optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.6", optional = true }
