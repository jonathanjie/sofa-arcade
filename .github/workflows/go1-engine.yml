name: GO1 Gravity Orchard engine

on:
  pull_request:
    paths:
      - 'games/gravity-orchard/**'
      - 'package*.json'
      - 'scripts/run-unit-tests.mjs'
      - '.github/workflows/go1-engine.yml'
      - 'docs/workstreams/gravity-orchard-go1.md'
      - 'docs/GRAVITY_ORCHARD_CONTRACT.md'
      - 'docs/games/gravity-orchard.md'
  push:
    branches: [main, feature/gravity-orchard-engine]
    paths:
      - 'games/gravity-orchard/**'
      - 'package*.json'
      - 'scripts/run-unit-tests.mjs'
      - '.github/workflows/go1-engine.yml'
      - 'docs/workstreams/gravity-orchard-go1.md'
      - 'docs/GRAVITY_ORCHARD_CONTRACT.md'
      - 'docs/games/gravity-orchard.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go1-engine-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-24.04
    # The exhaustive proof alone took 70 minutes under load. Node 24 also generates routes.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine, physics, authority, recovery, public fixtures and real input routes
        run: node --test games/gravity-orchard/tests/*.test.mjs
      - name: Run all campaign seeds and replay assertions
        if: matrix.node == '24'
        run: npm run test:exhaustive -- gravity-orchard
      - name: Verify canonical public fixtures
        run: node games/gravity-orchard/tests/generate-fixtures.mjs --check
      - name: Exhaustive inventory proof
        run: node games/gravity-orchard/checks/inventory.mjs --out games/gravity-orchard/.evidence/inventory.json
      - name: Preserve actual input transcripts and path coverage
        if: matrix.node == '24'
        run: node games/gravity-orchard/validation/run-routes.mjs --output=games/gravity-orchard/.evidence/routes
      - name: Measure bounded eight-fruit engine workload
        run: node games/gravity-orchard/checks/benchmark.mjs --out games/gravity-orchard/.evidence/benchmark.json
      - name: Preserve engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go1-engine-node-${{ matrix.node }}
          path: games/gravity-orchard/.evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  graphical-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: games/gravity-orchard/harness/package-lock.json
      - name: Install locked diagnostic browser dependency
        run: npm ci --prefix games/gravity-orchard/harness
      - name: Install Chromium for the isolated browser test
        run: node games/gravity-orchard/harness/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise keyboard, rendered three-stage campaign, hazards, pause and practice
        env:
          GO1_BROWSER_EVIDENCE: games/gravity-orchard/.evidence/browser
        run: node games/gravity-orchard/harness/browser-check.mjs
      - name: Preserve rendered screenshots and browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go1-graphical-harness
          path: games/gravity-orchard/.evidence/browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
