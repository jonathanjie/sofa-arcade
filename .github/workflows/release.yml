name: Desktop release

# Push a tag such as v0.2.0 to publish a release. Installed apps check the
# newest release's latest.json at launch and update themselves.
#
# Before tagging, set the version with `node desktop/scripts/set-version.mjs 0.2.0`
# and commit. The repository secret TAURI_SIGNING_PRIVATE_KEY must hold the
# private key whose public half is in desktop/src-tauri/tauri.conf.json.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed update for ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            node_arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            node_arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check that the tag matches every desktop version field
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"
      - name: Install Rust and locked desktop tooling
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target '${{ matrix.target }}'
          npm ci --ignore-scripts
      - name: Build the app, DMG and signed update bundle
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          # Ad-hoc code signing, as in the desktop checks. This is not Developer ID
          # signing or notarization.
          APPLE_SIGNING_IDENTITY: '-'
          # Signs the update bundle so installed apps can verify it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Add the TAURI_SIGNING_PRIVATE_KEY repository secret first.'; exit 1; }
          node scripts/prepare.mjs --target '${{ matrix.target }}'
          node scripts/licenses.mjs --target '${{ matrix.target }}'
          npx tauri build --ci --target '${{ matrix.target }}' --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      - name: Collect release files
        run: |
          bundle='src-tauri/target/${{ matrix.target }}/release/bundle'
          mkdir -p release-assets
          cp "$bundle/macos/Sofa Arcade.app.tar.gz" 'release-assets/Sofa-Arcade_${{ matrix.arch }}.app.tar.gz'
          cp "$bundle/macos/Sofa Arcade.app.tar.gz.sig" 'release-assets/Sofa-Arcade_${{ matrix.arch }}.app.tar.gz.sig'
          cp "$bundle"/dmg/*.dmg 'release-assets/Sofa-Arcade_${{ matrix.arch }}.dmg'
          ls -l release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: desktop/release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write the updater manifest
        run: |
          node desktop/scripts/updater-manifest.mjs --version "${GITHUB_REF_NAME#v}" \
            --repo "$GITHUB_REPOSITORY" --dir release-assets --out release-assets/latest.json
      - name: Create the release with all files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --title "Sofa Arcade ${GITHUB_REF_NAME}" --generate-notes --verify-tag
