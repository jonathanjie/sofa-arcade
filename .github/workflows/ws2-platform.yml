name: WS2 private local multiplayer

on:
  pull_request:
    paths:
      - '.github/workflows/ws2-platform.yml'
      - 'game/**'
      - 'games/**'
      - 'server/**'
      - 'ui/**'
      - 'drizzle/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
  push:
    branches: [main, feature/local-platform]
    paths:
      - '.github/workflows/ws2-platform.yml'
      - 'game/**'
      - 'games/**'
      - 'server/**'
      - 'ui/**'
      - 'drizzle/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: ws2-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-platform:
    name: Private platform (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record the actual runtime and architecture
        run: node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
      - name: Verify private authority, real LAN payloads, and client lifecycle
        run: >-
          node --test
          server/rooms.test.mjs
          server/lan.test.mjs
          server/room-platform.test.mjs
          server/room-lan-integration.test.mjs
          ui/transport.test.mjs
          ui/room-client.test.mjs
